# ==========================================================
#                 UNSTABLE FFA MESSAGES
# ==========================================================
#  Colors:  &#FF9147 &l ...   hex &#FF791F   gradient <gradient:#FF7518:#FFFFFF>Te</gradient><gradient:#FFFFFF:#FF7518>xt</gradient>
#  \n = new line.  Words in {curly brackets} are filled in by the plugin.
#  Set a message to "" to turn it off.
#  The prefix is put in front of every chat message (not in front of menus, titles or broadcasts).

prefix: "<gradient:#FF7518:#FFFFFF>&lUnstab</gradient><gradient:#FFFFFF:#FF7518>&lleFFA</gradient>"

